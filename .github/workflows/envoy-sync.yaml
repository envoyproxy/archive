name: Update Envoy archive

permissions:
  contents: read

on:
  workflow_dispatch:
    # `commit_sha` is not used but is required by the website envoy-sync.yml
    # so added here for compatibility
    inputs:
      commit_sha:
        type: string
        required: false
        default: ""
      dry-run:
        type: boolean
        default: false
      backfill:
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: ${{ github.workflow }}


jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      DRY_RUN: >-
        ${{ github.event_name == 'schedule'
            || fromJSON(inputs.dry-run || 'false') }}
    if: |
      !contains(github.actor, '[bot]')
      || github.actor == 'sync-envoy[bot]'
    steps:
    - uses: envoyproxy/toolshed/actions/bind-mounts@598eacce15ab5f208102a2fd5669292868002701  # v0.4.0
      with:
        mounts: |
          - src: /mnt/workspace
            target: GITHUB_WORKSPACE
            chown: "runner:runner"

    # Checkout the Envoy repo - the docs for each missing version are built
    # from its own checkout
    - name: 'Checkout Envoy'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        repository: envoyproxy/envoy
        ref: main
        path: envoy
        fetch-depth: 0

    # Checkout this repo, excluding the (legacy) `docs/` directory
    - name: 'Checkout Repository'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        path: archive
        sparse-checkout: |
          .bazelrc
          .bazelversion
          BUILD
          MODULE.bazel
          bazel
          tools
          versions.bzl
        sparse-checkout-cone-mode: false

    - uses: envoyproxy/toolshed/actions/gcp/setup@4a6a2986abd53c8a2d1077de4165fae369c5bc41  # actions-v0.4.23
      with:
        key: ${{ secrets.GCS_ARCHIVE_KEY }}

    # The setup action writes GCP_KEY_PATH to $GITHUB_ENV. The archive Bazel
    # targets read that environment variable directly for rclone GCS auth.
    - name: 'Repin Envoy'
      working-directory: archive
      run: |
        set -euo pipefail
        ENVOY_VERSION="$(git -C ../envoy rev-parse HEAD)"
        echo "Syncing Envoy -> ${ENVOY_VERSION}"
        # Repin the `envoy`/`envoy_api` `archive_override`s in MODULE.bazel
        ENVOY_SHA256="$(curl -sfL "https://github.com/envoyproxy/envoy/archive/${ENVOY_VERSION}.tar.gz" | sha256sum | cut -d' ' -f1)"
        CURRENT_VERSION="$(sed -n 's|.*/envoy/archive/\([0-9a-f]\{40\}\)\.tar\.gz.*|\1|p' MODULE.bazel | head -n1)"
        CURRENT_SHA256="$(grep -A1 "envoy/archive/${CURRENT_VERSION}.tar.gz" MODULE.bazel | sed -n 's|.*sha256 = "\([0-9a-f]\{64\}\)".*|\1|p' | head -n1)"
        if [[ -z "$ENVOY_SHA256" || -z "$CURRENT_VERSION" || -z "$CURRENT_SHA256" ]]; then
            echo "Unable to resolve Envoy pins in MODULE.bazel" >&2
            exit 1
        fi
        sed -i -e "s/${CURRENT_VERSION}/${ENVOY_VERSION}/g" -e "s/${CURRENT_SHA256}/${ENVOY_SHA256}/g" MODULE.bazel

    # `have` (the archive bucket) vs `want` (the Envoy releases that should be
    # archived) -> `plan.json`, `missing.txt` and a human-readable summary.
    - name: 'Reconcile archive'
      working-directory: archive
      run: |
        set -euo pipefail
        # TODO: fix upstream stamping of project data
        CACHEBUST="$(git rev-parse HEAD | head -c7)"
        bazel build \
            --action_env=CACHEBUST="${CACHEBUST}" \
            --host_action_env=CACHEBUST="${CACHEBUST}" \
            --config=ci --config=remote-envoy-engflow \
            --//tools/archive:archive_bucket="${GCS_ARCHIVE_BUCKET}" \
            --//tools/archive:meta_bucket="${GCS_META_BUCKET}" \
            //tools/archive:plan //tools/archive:missing_txt //tools/archive:summary
        cat bazel-bin/tools/archive/summary.txt
        cp bazel-bin/tools/archive/missing.txt "${RUNNER_TEMP}/missing.txt"
      env:
        GCS_ARCHIVE_BUCKET: ${{ vars.GCS_ARCHIVE_BUCKET }}
        GCS_META_BUCKET: ${{ vars.GCS_META_BUCKET }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # One-off/repair: backfill sidecars for versions in the archive bucket
    # that don't have one yet (eg the seeded versions). Only runs when
    # explicitly requested via workflow_dispatch.
    - name: 'Backfill sidecars'
      if: |
        env.DRY_RUN != 'true'
        && fromJSON(inputs.backfill || 'false')
      working-directory: archive
      run: |
        set -euo pipefail
        bazel run \
            --config=ci --config=remote-envoy-engflow \
            --//tools/archive:archive_bucket="${GCS_ARCHIVE_BUCKET}" \
            --//tools/archive:meta_bucket="${GCS_META_BUCKET}" \
            //tools/archive:backfill -- --all
      env:
        GCS_ARCHIVE_BUCKET: ${{ vars.GCS_ARCHIVE_BUCKET }}
        GCS_META_BUCKET: ${{ vars.GCS_META_BUCKET }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Build any missing versions and publish them to the archive bucket. The
    # manifest is rebuilt from fresh bucket listings after any uploads.
    - name: 'Build and publish missing versions'
      if: env.DRY_RUN != 'true'
      working-directory: archive
      run: |
        set -uo pipefail
        FAILED=()
        while read -r version; do
            if [[ -z "$version" ]]; then
                continue
            fi
            echo "Archiving docs: ${version}"
            if ! ./tools/archive/build-docs.sh "$version" "${RUNNER_TEMP}/${version}.tar.gz"; then
                echo "Failed to build docs: ${version}" >&2
                FAILED+=("$version")
                continue
            fi
            if ! bazel run \
                    --config=ci --config=remote-envoy-engflow \
                    --//tools/archive:archive_bucket="${GCS_ARCHIVE_BUCKET}" \
                    --//tools/archive:meta_bucket="${GCS_META_BUCKET}" \
                    //tools/archive:publish -- \
                    --version="$version" \
                    --tarball="${RUNNER_TEMP}/${version}.tar.gz"; then
                echo "Failed to publish docs: ${version}" >&2
                FAILED+=("$version")
            fi
            rm -f "${RUNNER_TEMP}/${version}.tar.gz"
        done < "${RUNNER_TEMP}/missing.txt"
        if [[ "${#FAILED[@]}" -ne 0 ]]; then
            echo "Failed versions: ${FAILED[*]}" >&2
            exit 1
        fi
      env:
        ENVOY_SRC_DIR: ../envoy
        GCS_ARCHIVE_BUCKET: ${{ vars.GCS_ARCHIVE_BUCKET }}
        GCS_META_BUCKET: ${{ vars.GCS_META_BUCKET }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # Rebuild the manifest from fresh bucket listings and sidecars and upload
    # it if it changed. Runs regardless of whether anything was published
    # above - the manifest is derived data and may need (re)generating even
    # when the archive is already complete (eg the first run against a
    # pre-seeded bucket). publish_manifest no-ops if nothing changed, and
    # refuses to upload while any archived version lacks a sidecar.
    - name: 'Publish manifest'
      if: env.DRY_RUN != 'true'
      working-directory: archive
      run: |
        set -euo pipefail
        bazel build \
            --config=ci --config=remote-envoy-engflow \
            --//tools/archive:archive_bucket="${GCS_ARCHIVE_BUCKET}" \
            --//tools/archive:meta_bucket="${GCS_META_BUCKET}" \
            //tools/archive:manifest //tools/archive:changed //tools/archive:missing_sidecars
        bazel run \
            --config=ci --config=remote-envoy-engflow \
            --//tools/archive:archive_bucket="${GCS_ARCHIVE_BUCKET}" \
            --//tools/archive:meta_bucket="${GCS_META_BUCKET}" \
            //tools/archive:publish_manifest
      env:
        GCS_ARCHIVE_BUCKET: ${{ vars.GCS_ARCHIVE_BUCKET }}
        GCS_META_BUCKET: ${{ vars.GCS_META_BUCKET }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
